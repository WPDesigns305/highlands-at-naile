<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highlands at NAILE · 2026 Showbook</title>
<meta name="description" content="Digital showbook for the 2026 Highland Cattle Show at the North American International Livestock Exposition, Louisville, Kentucky.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --peat:#1E2B24; --moss:#3E5A45; --dun:#A3532A; --heather:#6F5B7E; --gold:#C29A2E;
  --bg:#EEF0EA; --surface:#FFFFFF; --surface-2:#F6F7F3; --ink:#1E2B24; --ink-soft:#4F5B54;
  --line:#D5DAD1; --accent:#A3532A; --accent-ink:#FFFFFF; --focus:#6F5B7E;
  --warn-bg:#FFF4CC; --warn-ink:#5C4500;
  --serif:"Alegreya", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141B17; --surface:#1C2520; --surface-2:#222D27; --ink:#E9ECE6; --ink-soft:#A8B3AB;
    --line:#33413A; --accent:#D27A4A; --accent-ink:#141B17; --focus:#B9A3CC;
    --warn-bg:#3A3112; --warn-ink:#F2DE9A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141B17; --surface:#1C2520; --surface-2:#222D27; --ink:#E9ECE6; --ink-soft:#A8B3AB;
  --line:#33413A; --accent:#D27A4A; --accent-ink:#141B17; --focus:#B9A3CC;
  --warn-bg:#3A3112; --warn-ink:#F2DE9A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--peat)}
img{max-width:100%}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* ---------- Hero: the tartan ---------- */
.hero{
  position:relative;color:#fff;overflow:hidden;
  background-color:var(--peat);
  background-image:
    repeating-linear-gradient(90deg, rgba(163,83,42,.55) 0 14px, transparent 14px 46px, rgba(111,91,126,.45) 46px 52px, transparent 52px 92px),
    repeating-linear-gradient(0deg,  rgba(163,83,42,.55) 0 14px, transparent 14px 46px, rgba(111,91,126,.45) 46px 52px, transparent 52px 92px),
    repeating-linear-gradient(90deg, rgba(62,90,69,.9) 0 30px, transparent 30px 92px),
    repeating-linear-gradient(0deg,  rgba(62,90,69,.6) 0 30px, transparent 30px 92px),
    repeating-linear-gradient(90deg, rgba(194,154,46,.6) 0 2px, transparent 2px 92px);
}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,27,23,.15),rgba(20,27,23,.82) 70%)}
.hero .wrap{position:relative;z-index:1;padding-top:56px;padding-bottom:40px}
.hero .kicker{font:500 15px/1.3 var(--sans);opacity:.9;margin:0 0 10px}
.hero h1{font:800 clamp(44px,11vw,96px)/.92 var(--serif);letter-spacing:-.01em;margin:0 0 14px}
.hero .when{font:700 20px/1.3 var(--serif);margin:0}
.hero .where{margin:2px 0 0;opacity:.9}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{appearance:none;border:1px solid transparent;border-radius:999px;padding:9px 16px;font:500 15px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn-light{background:#fff;color:var(--peat)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn svg{width:16px;height:16px}

/* ---------- Tabs ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--peat)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;color:#C9D3CC;text-decoration:none;padding:15px 14px 13px;font:500 16px/1 var(--sans);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:#fff;border-bottom-color:var(--gold)}

/* ---------- Notice ---------- */
.notice{background:var(--warn-bg);color:var(--warn-ink);font-size:15px;padding:10px 0}
.notice[hidden]{display:none}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin:22px 0 6px;flex-wrap:wrap}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font:400 17px/1.2 var(--sans);padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-soft)}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 14px;font:500 15px/1 var(--sans);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--peat);color:#fff;border-color:var(--peat)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--gold);color:#141B17;border-color:var(--gold)}
.chip svg{width:16px;height:16px}

/* ---------- Sections ---------- */
main{padding-bottom:40px}
.view[hidden]{display:none}
h2{font:800 34px/1.1 var(--serif);margin:30px 0 6px}
.lede{color:var(--ink-soft);margin:0 0 18px;max-width:62ch}
h3{font:700 22px/1.2 var(--serif);margin:0}

.welcome-text{font:500 20px/1.6 var(--serif);max-width:62ch;margin:26px 0 10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:22px 0}
.facts div{background:var(--surface);padding:14px 16px}
.facts dt{font-size:14px;color:var(--ink-soft)}
.facts dd{margin:2px 0 0;font-weight:700}

.timeline{list-style:none;margin:0;padding:0;border-left:3px solid var(--dun);margin-left:6px}
.timeline li{position:relative;padding:0 0 18px 20px}
.timeline li::before{content:"";position:absolute;left:-8px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:3px solid var(--dun)}
.timeline .t{font-size:14px;color:var(--ink-soft)}
.timeline .e{font-weight:700}

/* class block */
.class{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
.class-head{display:flex;gap:14px;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.class-num{font:700 15px/1 var(--sans);color:var(--dun);min-width:34px}
.class-meta{font-size:14px;color:var(--ink-soft)}
.class-count{margin-left:auto;font-size:14px;color:var(--ink-soft);white-space:nowrap}
.empty{padding:14px 16px;color:var(--ink-soft);font-style:italic}

.entry{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:start;padding:14px 16px;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.back{font:800 26px/1 var(--serif);text-align:center;background:var(--peat);color:#fff;border-radius:8px;padding:10px 0 8px}
:root[data-theme="dark"] .back{background:#2C3A32}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .back{background:#2C3A32}}
.entry .name{font:700 19px/1.25 var(--serif)}
.entry .who{color:var(--ink-soft);font-size:15px}
.entry details{margin-top:6px}
.entry summary{cursor:pointer;font-size:14px;color:var(--accent);list-style:none}
.entry summary::-webkit-details-marker{display:none}
.entry summary::before{content:"+ "}
.entry details[open] summary::before{content:"− "}
.pedigree{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px;margin:8px 0 0}
.pedigree dt{color:var(--ink-soft)}
.pedigree dd{margin:0}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.star{appearance:none;border:0;background:none;padding:4px;cursor:pointer;color:var(--ink-soft)}
.star svg{width:24px;height:24px}
.star[aria-pressed="true"]{color:var(--gold)}
.star[aria-pressed="true"] svg path{fill:currentColor}
.ribbon{font:700 13px/1 var(--sans);padding:6px 9px;border-radius:5px;white-space:nowrap}
.r1{background:#1F4FA8;color:#fff}.r2{background:#B3261E;color:#fff}.r3{background:#fff;color:#222;border:1px solid #bbb}
.r4{background:#E7A2BC;color:#3a0d1d}.r5{background:#2F7D47;color:#fff}.rx{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}

.champs{background:var(--peat);color:#fff;border-radius:12px;padding:18px;margin:22px 0}
.champs h3{color:#fff;margin-bottom:10px}
.champs ul{list-style:none;margin:0;padding:0}
.champs li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.15);flex-wrap:wrap}
.champs li:first-child{border-top:0}
.champs .w{font:700 17px/1.3 var(--serif);color:#F1D68A}
.champs .tbd{opacity:.7;font-style:italic}

/* sponsors */
.level{margin:24px 0}
.level-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px;gap:10px}
.level-head .p{color:var(--ink-soft);font-size:15px;white-space:nowrap}
.sponsor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sponsor{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:inherit;display:block}
.sponsor.partner{grid-column:1/-1;border-left:6px solid var(--dun)}
.sponsor img{max-height:70px;margin-bottom:10px;display:block}
.sponsor .sn{font:700 19px/1.25 var(--serif)}
.sponsor .st{color:var(--ink-soft);font-size:15px}
.sponsor .ad{margin-top:6px}
.open-slot{border:2px dashed var(--line);border-radius:12px;padding:16px;color:var(--ink-soft)}
.cta-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin:30px 0}

/* exhibitor index */
.exh{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.exh-row{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.exh-row:first-child{border-top:0}
.exh-row .n{font-weight:700}
.exh-row .b{color:var(--ink-soft);font-size:15px}
.jump{all:unset;cursor:pointer;color:var(--accent);font-weight:500;font-size:15px;margin-left:8px}
.jump:focus-visible{outline:3px solid var(--focus)}

.no-results{padding:24px 0;color:var(--ink-soft)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}

footer{background:var(--peat);color:#C9D3CC;padding:30px 0 40px;font-size:15px}
footer a{color:#fff}
footer .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.theme-toggle{background:none;border:1px solid rgba(255,255,255,.35);color:#fff}

dialog{border:0;border-radius:16px;padding:24px;max-width:340px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);text-align:center}
dialog::backdrop{background:rgba(20,27,23,.7)}
#qrBox{background:#fff;padding:14px;border-radius:10px;display:inline-block;line-height:0}
#qrBox svg{width:220px;height:220px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--peat);color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:560px){
  .entry{grid-template-columns:48px 1fr auto;gap:10px;padding:12px}
  .back{font-size:22px}
  h2{font-size:28px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{.tabs,.toolbar,footer,.star,.hero .actions{display:none!important}.view{display:block!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="kicker" id="hExpo"></p>
    <h1 id="hTitle">Highlands at NAILE</h1>
    <p class="when" id="hWhen"></p>
    <p class="where" id="hWhere"></p>
    <div class="actions">
      <a class="btn btn-light" href="#junior">View the show</a>
      <button class="btn btn-ghost" type="button" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>
        Share
      </button>
      <button class="btn btn-ghost" type="button" id="qrBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
        QR code
      </button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Showbook sections">
  <div class="wrap">
    <a class="tab" href="#welcome">Welcome</a>
    <a class="tab" href="#junior">Junior show</a>
    <a class="tab" href="#showmanship">Showmanship</a>
    <a class="tab" href="#open">Open show</a>
    <a class="tab" href="#exhibitors">Exhibitors</a>
    <a class="tab" href="#sponsors">Sponsors</a>
  </div>
</nav>

<div class="notice" id="sampleNotice" hidden><div class="wrap">Entries marked as samples are placeholders and will be replaced with the official entry list.</div></div>

<main class="wrap">
  <div class="toolbar" id="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr" style="position:absolute;left:-9999px">Search entries</span>
      <input type="search" id="q" placeholder="Search back number, animal, exhibitor or farm" autocomplete="off">
    </label>
    <button class="chip" type="button" id="favToggle" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      <span>Following <span id="favCount"></span></span>
    </button>
  </div>

  <section class="view" id="v-welcome"></section>
  <section class="view" id="v-junior" hidden></section>
  <section class="view" id="v-showmanship" hidden></section>
  <section class="view" id="v-open" hidden></section>
  <section class="view" id="v-exhibitors" hidden></section>
  <section class="view" id="v-sponsors" hidden></section>
  <section class="view" id="v-search" hidden></section>
</main>

<footer>
  <div class="wrap">
    <div class="row">
      <div>
        <div>Breed representatives: <strong id="fReps" style="color:#fff"></strong></div>
        <div><a id="fEmail" href="#"></a></div>
        <div id="fUpdated" style="margin-top:6px"></div>
      </div>
      <button class="btn theme-toggle" type="button" id="themeBtn">Dark mode</button>
    </div>
  </div>
</footer>

<dialog id="qrDialog" aria-labelledby="qrTitle">
  <h3 id="qrTitle" style="margin-bottom:12px">Scan to open the showbook</h3>
  <div id="qrBox"></div>
  <p id="qrUrl" style="font-size:14px;word-break:break-all;color:var(--ink-soft)"></p>
  <button class="btn btn-accent" type="button" id="qrClose">Close</button>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="qrcode.js"></script>
<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var D = window.SHOWBOOK;
  if(!D){ document.querySelector("main").innerHTML = '<p class="no-results">The showbook data file (data.js) did not load. Check that data.js is uploaded next to index.html.</p>'; return; }

  var $ = function(s,el){return (el||document).querySelector(s)};
  var esc = function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var S = D.show;

  /* ---------- storage (per-viewer conveniences) ---------- */
  var store = {
    get:function(k,d){try{var v=localStorage.getItem("hn26:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem("hn26:"+k,JSON.stringify(v))}catch(e){}}
  };
  var favs = store.get("favs",[]);
  if(!Array.isArray(favs)) favs=[];
  var favOnly = false;

  /* ---------- theme ---------- */
  var theme = store.get("theme",null);
  function applyTheme(){
    if(theme) document.documentElement.setAttribute("data-theme",theme); else document.documentElement.removeAttribute("data-theme");
    var dark = theme ? theme==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    $("#themeBtn").textContent = dark ? "Light mode" : "Dark mode";
  }
  $("#themeBtn").addEventListener("click",function(){
    var dark = theme ? theme==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    theme = dark ? "light" : "dark"; store.set("theme",theme); applyTheme();
  });
  applyTheme();
  try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme); }catch(e){}

  /* ---------- header & footer ---------- */
  $("#hExpo").textContent = S.expo;
  $("#hTitle").textContent = S.title;
  $("#hWhen").textContent = S.date;
  $("#hWhere").textContent = S.venue + ", " + S.city;
  $("#fReps").textContent = S.reps;
  $("#fEmail").textContent = S.email; $("#fEmail").href = "mailto:"+S.email;
  $("#fUpdated").textContent = "Showbook last updated " + D.lastUpdated;

  /* ---------- helpers ---------- */
  function placeLabel(p){ if(!p) return ""; var n=+p; var suf=(n%100>=11&&n%100<=13)?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th"); return n+suf; }
  function ribbon(p){ if(!p) return ""; var c = p<=5 ? "r"+p : "rx"; return '<span class="ribbon '+c+'">'+placeLabel(p)+' place</span>'; }
  function entryKey(sec,cls,e){ return sec+"|"+cls+"|"+e.back+"|"+(e.animal||e.exhibitor); }
  function fmtDate(d){ if(!d) return ""; var p=d.split("-"); if(p.length!==3) return d; var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]; return m+" "+(+p[2])+", "+p[0]; }
  function where(e){ return [e.town,e.state].filter(Boolean).join(", "); }
  var starSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';

  /* flatten everything for search & exhibitor index */
  var ALL = [];
  function collect(sec, secLabel, classes, isShowman){
    classes.forEach(function(c){
      var cid = isShowman ? c.name : c.num;
      (c.entries||[]).forEach(function(e){
        ALL.push({sec:sec, secLabel:secLabel, cls:cid, clsLabel: isShowman ? c.name : ("Class "+c.num+" · "+c.name), e:e, key:entryKey(sec,cid,e), showman:!!isShowman, noRank:!!c.noRank});
      });
    });
  }
  collect("junior","Junior show",D.junior.classes);
  collect("showmanship","Showmanship",D.showmanship.divisions,true);
  collect("open","Open show",D.open.classes);
  if(ALL.some(function(x){return x.e.sample})) $("#sampleNotice").hidden=false;

  function entryHTML(item){
    var e=item.e, fav=favs.indexOf(item.key)>-1, id="e-"+btoa(unescape(encodeURIComponent(item.key))).replace(/[^a-zA-Z0-9]/g,"");
    var html = '<div class="entry" id="'+id+'" data-key="'+esc(item.key)+'">';
    html += '<div class="back" aria-label="Back number '+esc(e.back)+'">'+esc(e.back||"–")+'</div><div>';
    if(item.showman){
      html += '<div class="name">'+esc(e.exhibitor)+(e.sample?' <span class="class-meta">(sample)</span>':'')+'</div>';
      html += '<div class="who">'+[e.age?("Age "+esc(e.age)):"", esc(where(e))].filter(Boolean).join(" &nbsp;|&nbsp; ")+'</div>';
    } else {
      html += '<div class="name">'+esc(e.animal)+(e.sample?' <span class="class-meta">(sample)</span>':'')+'</div>';
      html += '<div class="who">'+esc(e.exhibitor)+(e.farm?(", "+esc(e.farm)):"")+(where(e)?(" &nbsp;|&nbsp; "+esc(where(e))):"")+'</div>';
      var ped = [["Born",fmtDate(e.dob)],["Sire",e.sire],["Dam",e.dam],["Reg. no.",e.reg]].filter(function(r){return r[1]});
      if(ped.length){
        html += '<details><summary>Pedigree and details</summary><dl class="pedigree">'+ped.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>'}).join("")+'</dl></details>';
      }
    }
    html += '</div><div class="side">';
    html += '<button class="star" type="button" aria-pressed="'+fav+'" aria-label="'+(fav?"Stop following":"Follow")+' '+esc(item.showman?e.exhibitor:e.animal)+'">'+starSvg+'</button>';
    if(!item.noRank) html += ribbon(e.place);
    html += '</div></div>';
    return html;
  }

  function classBlock(title, num, meta, items, emptyMsg, note){
    var h = '<article class="class"><div class="class-head">';
    if(num) h += '<span class="class-num">'+esc(num)+'</span>';
    h += '<div><h3>'+esc(title)+'</h3>'+(meta?'<div class="class-meta">'+esc(meta)+'</div>':'')+'</div>';
    h += '<span class="class-count">'+items.length+(items.length===1?" entry":" entries")+'</span></div>';
    if(note) h += '<div class="empty" style="font-style:normal">'+esc(note)+'</div>';
    h += items.length ? items.map(entryHTML).join("") : '<div class="empty">'+emptyMsg+'</div>';
    return h+'</article>';
  }
  function sortItems(items){
    var anyPlaced = items.some(function(i){return i.e.place});
    return items.slice().sort(function(a,b){
      if(anyPlaced){ var pa=a.e.place||999, pb=b.e.place||999; if(pa!==pb) return pa-pb; }
      return (parseInt(a.e.back,10)||0)-(parseInt(b.e.back,10)||0);
    });
  }
  function filterFav(items){ return favOnly ? items.filter(function(i){return favs.indexOf(i.key)>-1}) : items; }

  function champsBlock(title, list){
    return '<div class="champs"><h3>'+esc(title)+'</h3><ul>'+list.map(function(c){
      return '<li><span>'+esc(c.title)+'</span>'+(c.winner?'<span class="w">'+esc(c.winner)+'</span>':'<span class="tbd">Selected in the ring</span>')+'</li>';
    }).join("")+'</ul></div>';
  }

  /* ---------- views ---------- */
  function renderWelcome(){
    var h = '<p class="welcome-text">'+esc(S.welcome)+'</p>';
    h += '<dl class="facts">'+
      '<div><dt>Show day</dt><dd>'+esc(S.date)+'</dd></div>'+
      '<div><dt>Location</dt><dd>'+esc(S.venue)+'<br>'+esc(S.city)+'</dd></div>'+
      '<div><dt>Judge</dt><dd>'+esc(S.judge||"To be announced")+'</dd></div>'+
      '<div><dt>Sanction</dt><dd>'+esc(S.sanction)+'</dd></div>'+
      '<div><dt>Entries</dt><dd>'+ALL.filter(function(x){return !x.showman}).length+' head, '+ALL.filter(function(x){return x.showman}).length+' showmen</dd></div>'+
      '</dl>';
    h += '<h2>Schedule</h2><p class="lede">Times follow the NAILE ring schedule and can shift with the shows ahead of us. Listen for the ring call in the barn.</p><ol class="timeline">';
    D.schedule.forEach(function(s){ h += '<li><div class="t">'+esc(s.day)+' &nbsp;|&nbsp; '+esc(s.time)+'</div><div class="e">'+esc(s.event)+'</div></li>'; });
    h += '</ol>';
    $("#v-welcome").innerHTML = h;
  }

  function renderShow(sec, data, heading, lede){
    var h = '<h2>'+heading+'</h2><p class="lede">'+esc(lede)+'</p>', shown=0;
    data.classes.forEach(function(c){
      var items = filterFav(sortItems(ALL.filter(function(x){return x.sec===sec && x.cls===c.num})));
      if(favOnly && !items.length) return;
      shown++;
      h += classBlock(c.name, c.num, c.born, items, "No entries in this class.");
    });
    if(favOnly && !shown) h += '<p class="no-results">You are not following anyone in this show yet. Tap the star on an entry to follow it.</p>';
    h += champsBlock(heading+" champions", data.champions);
    $("#v-"+sec).innerHTML = h;
  }

  function renderShowmanship(){
    var d=D.showmanship, h='<h2>Showmanship</h2><p class="lede">'+esc(d.note)+'</p>', shown=0;
    d.divisions.forEach(function(v){
      var items = filterFav(sortItems(ALL.filter(function(x){return x.sec==="showmanship" && x.cls===v.name})));
      if(favOnly && !items.length) return;
      shown++;
      h += classBlock(v.name, "", v.ages, items, "No showmen entered in this division.", v.note);
    });
    if(favOnly && !shown) h += '<p class="no-results">You are not following any showmen yet.</p>';
    h += champsBlock("Showmanship champions", d.champions);
    $("#v-showmanship").innerHTML = h;
  }

  function renderExhibitors(){
    var map = {};
    ALL.forEach(function(x){
      var n = x.e.exhibitor || "Unnamed"; if(!map[n]) map[n]={name:n, farm:x.e.farm||"", where:where(x.e), items:[]};
      map[n].items.push(x);
    });
    var list = Object.keys(map).sort(function(a,b){return a.localeCompare(b)}).map(function(k){return map[k]});
    var h = '<h2>Exhibitors</h2><p class="lede">Everyone showing Highlands at NAILE this year. Tap a back number to jump to that entry.</p><div class="exh">';
    if(!list.length) h += '<div class="empty">Exhibitor list coming soon.</div>';
    list.forEach(function(x){
      h += '<div class="exh-row"><div><div class="n">'+esc(x.name)+'</div><div class="b">'+esc([x.farm,x.where].filter(Boolean).join(", "))+'</div></div><div>'+
        x.items.map(function(i){return '<button class="jump" type="button" data-key="'+esc(i.key)+'" data-sec="'+i.sec+'">#'+esc(i.e.back)+' '+(i.sec==="showmanship"?"showmanship":esc(i.sec==="junior"?"junior":"open"))+'</button>'}).join("")+'</div></div>';
    });
    $("#v-exhibitors").innerHTML = h+'</div>';
  }

  function renderSponsors(){
    var h = '<h2>Our sponsors</h2><p class="lede">This show is funded by people who believe in the breed. Please thank them in the barn and support their businesses.</p>';
    D.sponsorLevels.forEach(function(L){
      var sp = D.sponsors.filter(function(s){return s.level===L.id});
      h += '<section class="level"><div class="level-head"><h3>'+esc(L.name)+'</h3><span class="p">'+esc(L.price)+'</span></div>';
      if(sp.length){
        h += '<div class="sponsor-grid">'+sp.map(function(s){
          var tag = s.url ? 'a href="'+esc(s.url)+'" target="_blank" rel="noopener"' : 'div';
          return '<'+tag+' class="sponsor'+(L.id==="partner"?" partner":"")+'">'+(s.logo?'<img src="'+esc(s.logo)+'" alt="">':'')+
            '<div class="sn">'+esc(s.name)+'</div>'+(s.town?'<div class="st">'+esc(s.town)+'</div>':'')+(s.ad?'<div class="ad">'+esc(s.ad)+'</div>':'')+'</'+(s.url?'a':'div')+'>';
        }).join("")+'</div>';
      }
      if(L.limit && sp.length < L.limit){
        h += '<div class="open-slot"'+(sp.length?' style="margin-top:12px"':'')+'>'+(L.limit-sp.length)+' of '+L.limit+' partner spots still open.</div>';
      } else if(!sp.length){
        h += '<div class="open-slot">Be the first '+esc(L.name)+' sponsor.</div>';
      }
      h += '</section>';
    });
    h += '<div class="cta-box"><h3>Sponsor the Highland show</h3><p style="margin:8px 0 14px">Sponsorships fund awards, the hospitality area and the growth of this show. Every level is listed here in the showbook.</p>'+
      '<a class="btn btn-accent" href="mailto:'+esc(S.email)+'?subject='+encodeURIComponent("Sponsoring Highlands at NAILE")+'">Email the breed reps</a></div>';
    $("#v-sponsors").innerHTML = h;
  }

  function renderSearch(q){
    q = q.trim().toLowerCase();
    var items = ALL.filter(function(x){
      var e=x.e; return [e.back,e.animal,e.exhibitor,e.farm,e.town,e.state,e.sire,e.dam].join(" ").toLowerCase().indexOf(q)>-1;
    });
    items = filterFav(items);
    var h = '<h2>Search results</h2><p class="lede">'+items.length+' match'+(items.length===1?"":"es")+' for “'+esc(q)+'”.</p>';
    var groups = {};
    items.forEach(function(i){ (groups[i.secLabel+" — "+i.clsLabel] = groups[i.secLabel+" — "+i.clsLabel]||[]).push(i); });
    Object.keys(groups).forEach(function(g){ h += classBlock(g,"","",groups[g],""); });
    if(!items.length) h += '<p class="no-results">Try a back number, an exhibitor’s last name, or a farm name.</p>';
    $("#v-search").innerHTML = h;
  }

  /* ---------- routing ---------- */
  var VIEWS=["welcome","junior","showmanship","open","exhibitors","sponsors"];
  function current(){ var h=location.hash.replace("#",""); return VIEWS.indexOf(h)>-1?h:"welcome"; }
  function render(){
    var q = $("#q").value;
    renderWelcome(); renderShow("junior",D.junior,"Junior show",D.junior.note);
    renderShowmanship(); renderShow("open",D.open,"Open show",D.open.note);
    renderExhibitors(); renderSponsors();
    var v = current();
    document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-current", t.getAttribute("href")==="#"+v && !q.trim() ? "page":"false"); });
    VIEWS.concat("search").forEach(function(n){ $("#v-"+n).hidden = true; });
    if(q.trim()){ renderSearch(q); $("#v-search").hidden=false; }
    else $("#v-"+v).hidden=false;
    $("#toolbar").style.display = v==="sponsors" && !q.trim() ? "none" : "";
    $("#favCount").textContent = favs.length ? "("+favs.length+")" : "";
  }
  window.addEventListener("hashchange",function(){ $("#q").value=""; render(); window.scrollTo({top: $(".tabs").offsetTop - 0}); });

  $("#q").addEventListener("input",render);
  $("#favToggle").addEventListener("click",function(){ favOnly=!favOnly; this.setAttribute("aria-pressed",favOnly); render(); });

  document.addEventListener("click",function(ev){
    var s = ev.target.closest(".star");
    if(s){
      var key = s.closest(".entry").getAttribute("data-key"), i=favs.indexOf(key);
      if(i>-1) favs.splice(i,1); else favs.push(key);
      store.set("favs",favs); render(); return;
    }
    var j = ev.target.closest(".jump");
    if(j){
      var key2=j.getAttribute("data-key"), sec=j.getAttribute("data-sec");
      favOnly=false; $("#favToggle").setAttribute("aria-pressed","false");
      if(location.hash!=="#"+sec){ location.hash=sec; }
      setTimeout(function(){
        var el = document.querySelector('.entry[data-key="'+CSS.escape(key2)+'"]');
        if(el){ el.scrollIntoView({block:"center"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
      },60);
    }
  });

  /* ---------- share & QR ---------- */
  function siteUrl(){ return /example\.com/.test(D.siteUrl) ? location.href.split("#")[0] : D.siteUrl; }
  function toast(t){ var el=$("#toast"); el.textContent=t; el.classList.add("show"); setTimeout(function(){el.classList.remove("show")},2200); }
  $("#shareBtn").addEventListener("click",function(){
    var url=siteUrl();
    if(navigator.share){ navigator.share({title:S.title+" Showbook",url:url}).catch(function(){}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){toast("Link copied")},function(){toast(url)}); }
    else toast(url);
  });
  $("#qrBtn").addEventListener("click",function(){
    var url=siteUrl();
    try{ var qr=qrcode(0,"M"); qr.addData(url); qr.make(); $("#qrBox").innerHTML = qr.createSvgTag({cellSize:6,margin:0,scalable:true}); }
    catch(e){ $("#qrBox").textContent="QR code unavailable"; }
    $("#qrUrl").textContent=url;
    var d=$("#qrDialog"); if(d.showModal) d.showModal(); else d.setAttribute("open","");
  });
  $("#qrClose").addEventListener("click",function(){ var d=$("#qrDialog"); if(d.close) d.close(); else d.removeAttribute("open"); });

  render();
})();
</script>
</body>
</html>
